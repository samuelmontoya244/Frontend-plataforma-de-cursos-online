<div class="page-head">
  <h1>Cursos</h1>

  <button
    mat-flat-button
    color="primary"
    type="button"
    (click)="nuevo()"
  >
    <mat-icon>add</mat-icon>
    Nuevo curso
  </button>
</div>

@if (loading) {

  <div class="loading">
    <mat-spinner />
  </div>

} @else {

  <div class="table-wrap mat-elevation-z2">

    <table mat-table [dataSource]="dataSource">

      <!-- Nombre -->
      <ng-container matColumnDef="nombre_curso">
        <th mat-header-cell *matHeaderCellDef>
          Curso
        </th>

        <td mat-cell *matCellDef="let r">
          {{ r.nombre_curso }}
        </td>
      </ng-container>

      <!-- Categoría -->
      <ng-container matColumnDef="id_categoria">
        <th mat-header-cell *matHeaderCellDef>
          Categoría
        </th>

        <td mat-cell *matCellDef="let r">
          {{ r.id_categoria }}
        </td>
      </ng-container>

      <!-- Duración -->
      <ng-container matColumnDef="duracion_horas">
        <th mat-header-cell *matHeaderCellDef>
          Horas
        </th>

        <td mat-cell *matCellDef="let r">
          {{ r.duracion_horas }}
        </td>
      </ng-container>

      <!-- Estado -->
      <ng-container matColumnDef="estado_curso">
        <th mat-header-cell *matHeaderCellDef>
          Estado
        </th>

        <td mat-cell *matCellDef="let r">
          {{ r.estado_curso }}
        </td>
      </ng-container>

      <!-- Descripción -->
      <ng-container matColumnDef="descripcion_curso">
        <th mat-header-cell *matHeaderCellDef>
          Descripción
        </th>

        <td mat-cell *matCellDef="let r">
          {{ r.descripcion_curso || '-' }}
        </td>
      </ng-container>

      <!-- Fecha -->
      <ng-container matColumnDef="fecha_creacion">
        <th mat-header-cell *matHeaderCellDef>
          Creación
        </th>

        <td mat-cell *matCellDef="let r">
          {{ r.fecha_creacion | date:'short' }}
        </td>
      </ng-container>

      <!-- Acciones -->
      <ng-container matColumnDef="acciones">

        <th mat-header-cell *matHeaderCellDef></th>

        <td mat-cell *matCellDef="let r" class="actions">

          <button
            mat-icon-button
            type="button"
            (click)="editar(r)"
            aria-label="Editar"
          >
            <mat-icon>edit</mat-icon>
          </button>

          <button
            mat-icon-button
            type="button"
            (click)="eliminar(r)"
            aria-label="Eliminar"
          >
            <mat-icon>delete</mat-icon>
          </button>

        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

    </table>

    <mat-paginator
      [pageSizeOptions]="[5, 10, 25]"
      showFirstLastButtons
    />

  </div>
}
