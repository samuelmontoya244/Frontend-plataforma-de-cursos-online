<h2 mat-dialog-title>{{ data.mode === 'create' ? 'Nuevo usuario' : 'Editar usuario' }}</h2>
<mat-dialog-content class="dialog-body">
  <form [formGroup]="form" class="grid">
    <mat-form-field appearance="outline">
      <mat-label>Nombre de usuario</mat-label>
      <input matInput formControlName="nombre_usuario" autocomplete="username" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Tipo de documento</mat-label>
      <mat-select formControlName="tipo_documento">
        <mat-option value="CC">Cédula</mat-option>
        <mat-option value="TI">Tarjeta de identidad</mat-option>
        <mat-option value="CE">Cédula extranjera</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Número de documento</mat-label>
      <input matInput formControlName="documento_identidad" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="span-2">
      <mat-label>Email</mat-label>
      <input matInput type="email" formControlName="email" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="span-2">
      <mat-label>Contraseña</mat-label>
      <input matInput type="password" formControlName="contrasena" />
      @if (data.mode === 'edit') {
      <mat-hint>Dejar vacío para no cambiar</mat-hint>
      }
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Rol</mat-label>
      <input matInput formControlName="rol" />
    </mat-form-field>

    <mat-checkbox formControlName="activo" class="span-2">Activo</mat-checkbox>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancelar</button>
  <button mat-flat-button color="primary" type="button" (click)="save()">Guardar</button>
</mat-dialog-actions>
