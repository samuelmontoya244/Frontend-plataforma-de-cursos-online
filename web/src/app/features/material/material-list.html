<div class="page-head">

  <h1>Materiales</h1>

  <button
    mat-flat-button
    color="primary"
    type="button"
    (click)="nuevo()"
  >
    <mat-icon>add</mat-icon>
    Nuevo
  </button>

</div>

@if (loading) {

  <div class="loading">
    <mat-spinner />
  </div>

} @else {

  <div class="table-wrap mat-elevation-z2">

    <table
      mat-table
      [dataSource]="dataSource"
    >

      <ng-container matColumnDef="titulo_material">

        <th
          mat-header-cell
          *matHeaderCellDef
        >
          Material
        </th>

        <td
          mat-cell
          *matCellDef="let r"
        >
          {{ r.titulo_material }}
        </td>

      </ng-container>

      <ng-container matColumnDef="id_leccion">

        <th
          mat-header-cell
          *matHeaderCellDef
        >
          Lección
        </th>

        <td
          mat-cell
          *matCellDef="let r"
        >
          {{ r.id_leccion }}
        </td>

      </ng-container>

      <ng-container matColumnDef="tipo_material">

        <th
          mat-header-cell
          *matHeaderCellDef
        >
          Tipo
        </th>

        <td
          mat-cell
          *matCellDef="let r"
        >
          {{ r.tipo_material || '-' }}
        </td>

      </ng-container>

      <ng-container matColumnDef="URL_archivo">

        <th
          mat-header-cell
          *matHeaderCellDef
        >
          Archivo
        </th>

        <td
          mat-cell
          *matCellDef="let r"
        >
          <a
            [href]="r.URL_archivo"
            target="_blank"
          >
            Ver archivo
          </a>
        </td>

      </ng-container>

      <ng-container matColumnDef="fecha_creacion">

        <th
          mat-header-cell
          *matHeaderCellDef
        >
          Creación
        </th>

        <td
          mat-cell
          *matCellDef="let r"
        >
          {{
            r.fecha_creacion
            | date:'short'
          }}
        </td>

      </ng-container>

      <ng-container matColumnDef="acciones">

        <th
          mat-header-cell
          *matHeaderCellDef
        >
        </th>

        <td
          mat-cell
          *matCellDef="let r"
          class="actions"
        >

          <button
            mat-icon-button
            type="button"
            (click)="editar(r)"
            aria-label="Editar"
          >
            <mat-icon>edit</mat-icon>
          </button>

          <button
            mat-icon-button
            type="button"
            (click)="eliminar(r)"
            aria-label="Eliminar"
          >
            <mat-icon>delete</mat-icon>
          </button>

        </td>

      </ng-container>

      <tr
        mat-header-row
        *matHeaderRowDef="
          displayedColumns
        "
      ></tr>

      <tr
        mat-row
        *matRowDef="
          let row;
          columns: displayedColumns
        "
      ></tr>

    </table>

    <mat-paginator
      [pageSizeOptions]="[
        5,
        10,
        25
      ]"
      showFirstLastButtons
    />

  </div>
}
