<div class="page-head">

  <h1>Evaluaciones</h1>

  <button
    mat-flat-button
    color="primary"
    type="button"
    (click)="nuevo()"
  >
    <mat-icon>add</mat-icon>
    Nueva evaluación
  </button>

</div>

@if (loading) {

  <div class="loading">
    <mat-spinner />
  </div>

} @else {

  <div class="table-wrap mat-elevation-z2">

    <table mat-table [dataSource]="dataSource">

      <!-- Nombre -->
      <ng-container matColumnDef="nombre_evaluacion">

        <th mat-header-cell *matHeaderCellDef>
          Evaluación
        </th>

        <td mat-cell *matCellDef="let r">
          {{ r.nombre_evaluacion }}
        </td>

      </ng-container>

      <!-- Lección -->
      <ng-container matColumnDef="id_leccion">

        <th mat-header-cell *matHeaderCellDef>
          Lección
        </th>

        <td mat-cell *matCellDef="let r">
          {{ r.id_leccion }}
        </td>

      </ng-container>

      <!-- Porcentaje -->
      <ng-container matColumnDef="porcentaje">

        <th mat-header-cell *matHeaderCellDef>
          %
        </th>

        <td mat-cell *matCellDef="let r">
          {{ r.porcentaje }}
        </td>

      </ng-container>

      <!-- Fecha -->
      <ng-container matColumnDef="fecha_creacion">

        <th mat-header-cell *matHeaderCellDef>
          Creación
        </th>

        <td mat-cell *matCellDef="let r">
          {{ r.fecha_creacion | date:'short' }}
        </td>

      </ng-container>

      <!-- Acciones -->
      <ng-container matColumnDef="acciones">

        <th mat-header-cell *matHeaderCellDef></th>

        <td
          mat-cell
          *matCellDef="let r"
          class="actions"
        >

          <button
            mat-icon-button
            type="button"
            (click)="editar(r)"
            aria-label="Editar"
          >
            <mat-icon>edit</mat-icon>
          </button>

          <button
            mat-icon-button
            type="button"
            (click)="eliminar(r)"
            aria-label="Eliminar"
          >
            <mat-icon>delete</mat-icon>
          </button>

        </td>

      </ng-container>

      <tr
        mat-header-row
        *matHeaderRowDef="displayedColumns"
      ></tr>

      <tr
        mat-row
        *matRowDef="let row; columns: displayedColumns"
      ></tr>

    </table>

    <mat-paginator
      [pageSizeOptions]="[5, 10, 25]"
      showFirstLastButtons
    />

  </div>
}
