<div class="page-head">
  <h1>Certificados</h1>
  <button mat-flat-button color="primary" type="button" (click)="nuevo()">
    <mat-icon>add</mat-icon>
    Nuevo
  </button>
</div>

@if (loading) {
  <div class="loading">
    <mat-spinner />
  </div>
} @else {
  <div class="table-wrap mat-elevation-z2">
    <table mat-table [dataSource]="dataSource">

      <ng-container matColumnDef="id_certificado">
        <th mat-header-cell *matHeaderCellDef>ID Certificado</th>
        <td mat-cell *matCellDef="let r" class="uuid-cell">{{ r.id_certificado }}</td>
      </ng-container>

      <ng-container matColumnDef="id_inscripcion">
        <th mat-header-cell *matHeaderCellDef>Inscripción</th>
        <td mat-cell *matCellDef="let r" class="uuid-cell">{{ r.id_inscripcion }}</td>
      </ng-container>

      <ng-container matColumnDef="fecha_creacion">
        <th mat-header-cell *matHeaderCellDef>Creado</th>
        <td mat-cell *matCellDef="let r">{{ r.fecha_creacion || '—' }}</td>
      </ng-container>

      <ng-container matColumnDef="fecha_edicion">
        <th mat-header-cell *matHeaderCellDef>Editado</th>
        <td mat-cell *matCellDef="let r">{{ r.fecha_edicion || '—' }}</td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let r" class="actions">
          <button mat-icon-button type="button" (click)="editar(r)" aria-label="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button type="button" (click)="eliminar(r)" aria-label="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
    <mat-paginator [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons />
  </div>
}
